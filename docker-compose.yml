services:
  mon-per:
    build: .
    image: mon-per:latest
    container_name: mon-per
    restart: unless-stopped
    ports:
      # Gauche = port sur la machine hôte, droite = port interne de nginx
      # (à ne jamais changer). Autre port : créez un fichier .env contenant
      # PORT_NAS=3000
      - "${PORT_NAS:-8080}:80"
    # Le conteneur n'a besoin d'aucun volume ni d'aucune base de données :
    # la progression de l'enfant est stockée dans le navigateur.
    read_only: true
    # Système de fichiers en lecture seule : nginx n'a besoin que de ces trois
    # répertoires temporaires. Si le conteneur refuse de démarrer sur votre
    # installation, commentez `read_only` — le reste fonctionne tel quel.
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
