server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compression : utile surtout pour le CSS et les modules JS.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité. L'app n'appelle aucun service externe : la CSP peut
    # rester très stricte (tout est servi depuis la même origine).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Les fichiers statiques sont versionnés par le tag de l'image : cache court
    # côté navigateur pour que la mise à jour d'un contenu soit visible vite.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Le routage se fait par fragment (#/...), mais on renvoie tout de même
    # index.html pour les URL inconnues.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
